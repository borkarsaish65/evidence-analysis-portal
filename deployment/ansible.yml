---
# Evidence Analysis Portal - Frontend Deployment Playbook
# Vite React app — builds static dist/ served by nginx

- hosts: elevate
  vars:
    project_path: /opt/backend/deployment

  tasks:
    - name: Slurp vault token
      slurp:
        src: "{{ project_path }}/.token"
      register: slurpfile

    - name: Get vault credentials
      shell: "curl --location --request GET '{{ vaultAddress }}evidence-analysis-frontend' --header 'X-Vault-Token: {{ slurpfile['content'] | b64decode }}' | jq '.data.data' > '{{ project_path }}/frontend-data.json'"
      register: credentials

    - name: Set paths
      set_fact:
        release_path: "{{ project_path }}/releases/portal-{{ lookup('pipe','date +%Y%m%d%H%M%S') }}"
        current_path: "{{ project_path }}/evidence-portal"

    - name: Create release folder
      file:
        dest: "{{ release_path }}"
        mode: "0755"
        recurse: yes
        state: directory

    - name: Clone the repository
      git:
        repo: https://github.com/borkarsaish65/evidence-analysis-portal.git
        dest: "{{ release_path }}"
        clone: yes
        update: yes
        version: "{{ gitBranch }}"

    - name: Generate .env
      shell: cat {{ project_path }}/frontend-data.json | jq -r 'to_entries | .[] | "\(.key)=\(if (.value | type) == "string" then (.value | gsub("\n"; "\\n")) else (.value | tostring) end)"' > {{ release_path }}/.env
      register: envConfig

    - debug: msg="env config {{ envConfig }}"

    - name: Install Node dependencies
      shell: cd {{ release_path }} && npm install --legacy-peer-deps

    - name: Build frontend
      shell: cd {{ release_path }} && npm run build
      register: buildOutput

    - debug: msg="Build output {{ buildOutput }}"

    - name: Delete old portal folder
      shell: rm -rf {{ current_path }} && mkdir -p {{ current_path }}

    - name: Move build output to serving folder
      shell: mv {{ release_path }}/dist {{ current_path }}/dist

    - name: Delete release folder
      file:
        path: "{{ release_path }}"
        state: absent
